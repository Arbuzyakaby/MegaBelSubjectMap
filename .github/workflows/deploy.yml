name: Deploy to GitHub Pages

# Сборка и публикация сайта при каждом пуше в основную ветку репозитория
# (какой бы она ни была — main или другая) и по кнопке Run workflow.
# Готовый сайт выкладывается в ветку gh-pages, из которой его отдаёт GitHub Pages.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.event.head_commit.message || github.sha }}'
